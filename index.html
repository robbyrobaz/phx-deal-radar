<!doctype html>
<html><head><meta charset="utf-8"><title>Flight Deal Radar</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0e1116;--card:#161b22;--line:#273040;--fg:#e6edf3;--dim:#8b949e;
      --good:#3fb950;--warn:#d29922;--hot:#f85149;--acc:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
     font:14px/1.5 ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:18px 22px;border-bottom:1px solid var(--line);
       display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:19px;letter-spacing:.2px}
.sub{color:var(--dim);font-size:12px}
nav{display:flex;gap:4px;padding:12px 22px 0;flex-wrap:wrap}
nav button{background:transparent;border:1px solid var(--line);color:var(--dim);
  padding:7px 15px;border-radius:7px 7px 0 0;cursor:pointer;font-size:13px}
nav button.on{background:var(--card);color:var(--fg);border-bottom-color:var(--card)}
main{padding:0 22px 40px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:0 8px 8px 8px;padding:14px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
input[type=text]{background:#0d1117;border:1px solid var(--line);color:var(--fg);
  padding:7px 10px;border-radius:6px;min-width:210px}
label{color:var(--dim);font-size:12px;display:flex;gap:6px;align-items:center;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);
   color:var(--dim);font-weight:600;cursor:pointer;white-space:nowrap;user-select:none}
th:hover{color:var(--fg)}
th .ar{opacity:.45;font-size:10px}
td{padding:7px 9px;border-bottom:1px solid #1d232d;white-space:nowrap}
tr:hover td{background:#1b2129}
.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;
       border:1px solid var(--line);color:var(--dim)}
.b-watch{color:var(--acc);border-color:#1f4a7a}
.b-floor{color:var(--good);border-color:#1f5f2e}
.b-no{color:var(--hot);border-color:#5f2020}
.score{font-weight:700}
.s-hi{color:var(--good)} .s-mid{color:var(--warn)} .s-lo{color:var(--dim)}
.bar{display:inline-block;height:5px;border-radius:3px;background:var(--acc);vertical-align:middle}
.empty{color:var(--dim);padding:26px;text-align:center}
#wstrip{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.wchip{padding:2px 9px;border-radius:99px;font-size:11px;border:1px solid var(--line);color:var(--dim)}
.wchip.on{color:var(--good);border-color:#1f5f2e}
#body{overflow-x:auto;-webkit-overflow-scrolling:touch}
tbody tr{cursor:pointer}
.back{background:transparent;border:1px solid var(--line);color:var(--fg);
  padding:8px 16px;border-radius:7px;cursor:pointer;font-size:14px;margin-bottom:14px}
.back:hover{border-color:var(--acc)}
.dcard h2{margin:0 0 2px;font-size:22px}
.dcard .dsub{color:var(--dim);margin-bottom:14px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;margin:14px 0}
.dbox{background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.dbox .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.dbox .v{font-size:17px;font-weight:700;margin-top:3px}
.dbox .v small{font-weight:400;color:var(--dim);font-size:12px}
.dlinks{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.dlinks a{display:inline-block;background:var(--acc);color:#0d1117;font-weight:600;
  padding:10px 16px;border-radius:8px;text-decoration:none;font-size:14px}
.dlinks a.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
@media(max-width:760px){
 header{padding:12px 14px;gap:8px}
 h1{font-size:17px}
 nav{padding:10px 10px 0;gap:3px}
 nav button{padding:6px 10px;font-size:12px}
 main{padding:0 8px 30px}
 .panel{padding:10px 8px}
 th,td{padding:6px 5px;font-size:12px}
 input[type=text]{min-width:0;flex:1 1 140px}
 .controls{gap:7px;row-gap:9px}
 .bar{display:none}
 /* keep the decision columns (score, route, you-pay, cash, value, dates);
    drop the analyst columns — they live on desktop */
 .c-vs_median,.c-low,.c-days_out,.c-last_seen,.c-samples,.c-days,.c-ready{display:none}
 /* long city names were forcing the table wider than the phone: let the
    route cell wrap instead of nowrap-ing the whole row off screen */
 .c-dest{white-space:normal;min-width:105px}
 .c-cash,.c-miles{white-space:normal}
}
@media(max-width:560px){
 .c-dates,.c-median{display:none}
}
@media(max-width:430px){
 .c-cpp,.c-program,.c-flags{display:none}
 h1{font-size:15px}
 .badge{padding:1px 5px;font-size:10px}
}
.note{color:var(--dim);font-size:12px;margin:10px 0 0;line-height:1.6}
.kv{display:flex;gap:22px;flex-wrap:wrap;color:var(--dim);font-size:12px}
.kv b{color:var(--fg)}
code{background:#0d1117;padding:1px 5px;border-radius:4px;font-size:12px}
</style></head><body>

  <h1>✈️ Flight Deal Radar</h1>

<nav>

  </div>
  <div id="wstrip"></div>

</div></main>

<script>
let ROWS=[],ALERTS=[],HEALTH=null,TAB='now',SORT={k:'score',d:-1},NAMES={},DETAIL=null;
const $=s=>document.querySelector(s);
const fmt=(n,d=0)=>n==null?'—':Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const ago=t=>{if(!t)return'—';const s=Date.now()/1000-t;
  if(s<3600)return Math.round(s/60)+'m ago';if(s<86400)return Math.round(s/3600)+'h ago';
  return Math.round(s/86400)+'d ago';};

const COLS={
 now:[['score','Score'],['program','Prog'],['dest','Dest'],['miles','You pay'],['cash','Cash price'],
      ['cpp','Value ¢/mi'],['vs_median','vs median'],['low','Route floor (mi)'],
      ['days_out','Days out'],['dates','Dates'],['flags','']],
 hist:[['program','Prog'],['dest','Dest'],['n','Offers'],['days','Days'],['samples','Polls'],
       ['low','Floor (mi)'],['median','Median (mi)'],['miles','Latest (mi)'],['vs_median','vs median'],
       ['cpp','¢/mi'],['ready','Baseline'],['last_seen','Last seen']]
};

function visible(){
  let r=ROWS.slice();
  const q=$('#q').value.trim().toLowerCase();
  if(q)r=r.filter(x=>(x.dest+' '+x.origin+' '+x.program+' '+(x.dest_name||'')).toLowerCase().includes(q));
  if(TAB==='now'){
    if($('#afford').checked)r=r.filter(x=>x.affordable);
    r=r.filter(x=>x.miles!=null);
  }
  if($('#watch').checked)r=r.filter(x=>x.watchlist);
  if($('#floor').checked)r=r.filter(x=>x.at_floor);
  if($('#hz').checked)r=r.filter(x=>x.in_horizon);
  const k=SORT.k,d=SORT.d;
  r.sort((a,b)=>{let x=a[k],y=b[k];
    if(x==null)return 1;if(y==null)return -1;
    if(typeof x==='string')return d*x.localeCompare(y);
    return d*(x-y);});
  return r;
}
function scls(s){return s>=60?'s-hi':s>=35?'s-mid':'s-lo';}

function openDetail(r){DETAIL=r;location.hash='deal';render();window.scrollTo(0,0);}
window.addEventListener('hashchange',()=>{if(!location.hash&&DETAIL){DETAIL=null;render();note();}});

function renderDetail(){
  const r=DETAIL,el=$('#body');
  $('#ctl').style.display='none';
  $('#note').innerHTML='';
  const fee=r.fees!=null?` + $${fmt(r.fees)}`:'';
  const gf=`https://www.google.com/travel/flights?q=${encodeURIComponent('flights from '+r.origin+' to '+r.dest)}`;
  const boxes=[
    ['You pay',`${fmt(r.miles)} mi<small>${fee} taxes/fees</small>`],
    ['Cash price',r.cash?`$${fmt(r.cash)}<small>${r.save!=null?' · miles save ~$'+fmt(r.save):''}</small>`:'—<small> AA shows no cash fare</small>'],
    ['Value',r.cpp?`${fmt(r.cpp,2)}¢/mi`:'—'],
    ['Score',`${fmt(r.score,1)}<small> · value ${r.comp.value} / discount ${r.comp.discount} / afford ${r.comp.afford}</small>`],
    ['Travel window',r.dates?`${r.dates}<small>${r.days_out!=null?' · departs in '+r.days_out+'d':''}${r.in_horizon?'':' · beyond 60d alert horizon'}</small>`:'—'],
    ['Route floor',`${fmt(r.low)} mi<small>${r.at_floor?' · at floor now':''}</small>`],
    ['Route median',r.median?`${fmt(r.median)} mi<small>${r.vs_median!=null&&Math.abs(r.vs_median)>=0.05?' · now '+(r.vs_median>0?fmt(r.vs_median,1)+'% under':fmt(-r.vs_median,1)+'% over'):''}</small>`:'—'],
    ['History',`${fmt(r.n)} offer${r.n==1?'':'s'}<small> · ${fmt(r.span_days,1)}d span · ${fmt(r.samples)} polls · baseline ${r.baseline_ready?'ready':'building'}</small>`],
    ['Seen',`${ago(r.last_seen)}<small>${r.watchlist?' · on your watchlist':''}${r.affordable?'':' · over your balance'}</small>`],
  ];
  el.innerHTML=`<button class="back" onclick="history.back()">← Back to list</button>
    <div class="dcard">
    <h2>${r.origin} → ${r.dest} <span class="badge b-watch" style="vertical-align:middle">${r.program}</span></h2>
    <div class="dsub">${r.dest_name||''} · round trip · economy</div>
    <div class="dgrid">${boxes.map(([k,v])=>`<div class="dbox"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div>
    <div class="dlinks">
      ${r.url?`<a href="${r.url}" target="_blank" rel="noopener">Open ${r.program} deals board ↗</a>`:''}
      <a class="ghost" href="${gf}" target="_blank" rel="noopener">Google Flights ${r.origin}→${r.dest} ↗</a>
    </div>
    <div class="note">Deal boards rotate — the advertised price/date window may have moved since last seen. Verify on the airline site before planning around it.</div>
    </div>`;
}

function renderWatch(){
  const w=$('#wstrip');   // NOT #watch — that's the "watchlist only" checkbox
  if(TAB!=='now'||DETAIL||!HEALTH||!HEALTH.watchlist){w.innerHTML='';return;}
  const live={};ROWS.forEach(r=>{if(r.watchlist&&r.miles!=null)(live[r.dest]=live[r.dest]||[]).push(r.program);});
  w.innerHTML=Object.entries(HEALTH.watchlist).map(([code,name])=>{
    const p=live[code];
    return `<span class="wchip${p?' on':''}" title="${name}${p?'':' — not on the airline boards right now; blog/flash-sale lane still covers it'}">${code}${p?' ·'+[...new Set(p)].join('+'):''}</span>`;
  }).join('');
}
function render(){
  renderWatch();
  const el=$('#body');
  if(DETAIL&&TAB!=='alerts'&&TAB!=='health'){renderDetail();return;}
  $('#ctl').style.display=(TAB==='alerts'||TAB==='health')?'none':'flex';
  if(TAB==='alerts'){
    if(!ALERTS.length){el.innerHTML='<div class="empty">No alerts fired yet. That is the expected state — this is a rare-event detector.</div>';return;}
    el.innerHTML='<table><thead><tr><th>When</th><th>Prog</th><th>Route</th><th>Dates</th><th class="num">Miles</th><th class="num">Fees</th></tr></thead><tbody>'+
      ALERTS.map(a=>`<tr><td>${ago(a.first_seen)}</td><td>${a.program}</td>
        <td><b>${a.origin}→${a.dest}</b>${NAMES[a.dest]?' <span class="sub">'+NAMES[a.dest]+'</span>':''}</td><td>${a.dates||'—'}</td>
        <td class="num">${fmt(a.miles)}</td><td class="num">$${fmt(a.fees)}</td></tr>`).join('')+'</tbody></table>';
    return;
  }
  if(TAB==='health'){
    if(!HEALTH){el.innerHTML='<div class="empty">loading…</div>';return;}
    el.innerHTML=`<div class="kv" style="margin-bottom:14px">
      <div>price points <b>${fmt(HEALTH.observations)}</b></div>
      <div>airports named <b>${fmt(HEALTH.airports||0)}</b></div>
      <div>routes tracked <b>${fmt(HEALTH.routes)}</b></div></div>
      <table><thead><tr><th>When</th><th>Lane</th><th>Source</th><th>OK</th><th class="num">Parsed</th></tr></thead><tbody>`+
      HEALTH.runs.map(r=>`<tr><td>${ago(r.ts)}</td><td>${r.lane}</td><td>${r.source}</td>
        <td>${r.ok?'<span class="badge b-floor">ok</span>':'<span class="badge b-no">FAIL</span>'}</td>
        <td class="num">${fmt(r.found)}</td></tr>`).join('')+'</tbody></table>';
    return;
  }
  const cols=COLS[TAB],rows=visible();
  if(!rows.length){el.innerHTML='<div class="empty">Nothing matches these filters.</div>';return;}
  let h='<table><thead><tr>'+cols.map(([k,l])=>{
    const ar=SORT.k===k?(SORT.d<0?'▼':'▲'):'';
    const n=['score','miles','cash','cpp','vs_median','low','median','n','span_days'].includes(k)?' class="num"':'';
    return `<th${n} data-k="${k}">${l} <span class="ar">${ar}</span></th>`;}).join('')+'</tr></thead><tbody>';
  for(const r of rows){
    h+='<tr>';
    for(const [k] of cols){
      if(k==='score'){
        h+=`<td class="num"><span class="score ${scls(r.score)}">${fmt(r.score,1)}</span>
            <div class="bar" style="width:${Math.max(2,r.score*0.55)}px"></div></td>`;
      }else if(k==='flags'){
        let b='';
        if(r.watchlist)b+='<span class="badge b-watch">watch</span> ';
        if(r.at_floor)b+='<span class="badge b-floor">floor</span> ';
        if(r.drop_pct)b+=`<span class="badge b-floor">↓${fmt(r.drop_pct,0)}%</span> `;
        if(!r.affordable)b+='<span class="badge b-no">short</span>';
        h+=`<td>${b||'—'}</td>`;
      }else if(k==='dest'){
        h+=`<td><b>${r.origin}→${r.dest}</b>`
          +(r.dest_name?`<div class="sub" style="margin-top:-2px">${r.dest_name}</div>`:'')
          +`</td>`;
      }else if(k==='cash'){
        h+=`<td class="num">${r.cash?'$'+fmt(r.cash)
          +(r.save!=null?`<div class="sub">miles save ~$${fmt(r.save)}</div>`:'')
          :'—'}</td>`;
      }else if(k==='cpp'){h+=`<td class="num">${r.cpp?fmt(r.cpp,2):'—'}</td>`;
      }else if(k==='vs_median'){
        const v=r.vs_median;
        let txt,c='';
        if(v==null){txt='—';}
        else if(Math.abs(v)<0.05){txt='<span style="opacity:.45">flat</span>';}
        else if(v>0){txt='-'+fmt(v,1)+'%';c='style="color:var(--good)"';}
        else{txt='+'+fmt(Math.abs(v),1)+'%';c='style="color:var(--dim)"';}
        h+=`<td class="num" ${c}>${txt}</td>`;
      }else if(k==='days_out'){
        const v=r.days_out;
        h+=`<td class="num"${v!=null&&!r.in_horizon?' style="color:var(--warn)"':''}>${v==null?'—':v+'d'}</td>`;
      }else if(k==='ready'){
        h+=`<td>${r.baseline_ready?'<span class="badge b-floor">ready</span>'
             :'<span class="badge">building</span>'}</td>`;
      }else if(k==='last_seen'){h+=`<td>${ago(r.last_seen)}</td>`;
      }else if(k==='miles'&&TAB==='now'){
        h+=`<td class="num"><b>${fmt(r.miles)} mi</b>${r.fees!=null?` + $${fmt(r.fees)}`:''}</td>`;
      }else if(['miles','low','median','n','days','samples','days_out'].includes(k)){h+=`<td class="num">${fmt(r[k])}</td>`;
      }else if(k==='span_days'||k==='days'||k==='samples'){h+=`<td class="num">${fmt(r[k])}</td>`;
      }else{h+=`<td>${r[k]==null?'—':r[k]}</td>`;}
    }
    h+='</tr>';
  }
  el.innerHTML=h+'</tbody></table>';
  // tag each cell with its column key so the mobile media query can hide
  // whole columns without per-branch class bookkeeping in the renderer
  el.querySelectorAll('table').forEach(tb=>{
    const keys=[...tb.querySelectorAll('thead th')].map(x=>x.dataset.k||'');
    tb.querySelectorAll('tr').forEach(tr=>[...tr.children].forEach((c,i)=>{
      if(keys[i])c.classList.add('c-'+keys[i]);}));
  });
  el.querySelectorAll('tbody tr').forEach((tr,i)=>tr.onclick=()=>openDetail(rows[i]));
  el.querySelectorAll('th').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;if(!k||k==='flags')return;
    SORT = SORT.k===k?{k,d:-SORT.d}:{k,d:['dest','program','dates'].includes(k)?1:-1};
    render();});
}

function note(){
  const n=$('#note');
  if(TAB==='now')n.innerHTML='<b>Watchlist strip</b>: green = that destination is on an airline board right now (with which program); grey = not currently published from PHX — the blog/flash-sale lane still covers it, and it lights up the day a board rotates it on. <b>Tap any row for full details and booking links.</b> <b>You pay</b> = miles + government taxes/fees — your actual out-of-pocket when booking with miles. <b>Cash price</b> = what the identical ticket sells for in dollars; you never pay it, it\'s the benchmark your miles are measured against (and the source of the savings estimate). <b>Score</b> = 45% value (¢/mile vs a 3.0¢ reference) + 45% discount (how far under this route\'s own median) + 10% affordability (a gate: can you book it, not how much is left over). AA rows score 0 on value because aa.com publishes no cash fare — not a judgement, a data gap. Sort any column. <b>Days out</b> in amber = beyond the 60-day alert horizon: still tracked and ranked here, but it will not buzz your phone. Some long-haul value does sit inside the horizon (PHX→HKG at 2.67¢ was 13 days out), so this is a notification setting, not a quality signal.';
  else if(TAB==='hist')n.innerHTML='Every parsed row is recorded, qualifying or not. <b>Floor</b> is the cheapest ever seen for that route; the record-low alert needs 12+ sightings spanning 5+ days before it will trust one.';
  else if(TAB==='alerts')n.innerHTML='Only alerts actually delivered to Telegram appear here — route-level duplicates (same route re-advertised with rotated dates) are suppressed and counted on the Health tab instead. Thresholds are tuned for rarity: <code>cash ≤ $100</code>, <code>¢/mile ≥ 2.5</code>, route record low. Long silences are correct.';
  else n.innerHTML='';
}
function setTab(t){TAB=t;
  if(DETAIL){DETAIL=null;history.replaceState(null,'',location.pathname+location.search);}
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('#ctl').style.display=(t==='alerts'||t==='health')?'none':'flex';
  if(t==='now'&&!['score','miles','cash','cpp','vs_median'].includes(SORT.k))SORT={k:'score',d:-1};
  if(t==='hist'&&SORT.k==='score')SORT={k:'n',d:-1};
  render();note();}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
['q','afford','watch','floor','hz'].forEach(id=>$('#'+id).oninput=render);

async function load(){
  [ROWS,ALERTS,HEALTH]=await Promise.all(
    [window.__DATA.rows,window.__DATA.alerts,window.__DATA.health]);
  NAMES={};ROWS.forEach(r=>{if(r.dest_name)NAMES[r.dest]=r.dest_name;});
  const days=HEALTH.first_ts?Math.max(1,Math.round((HEALTH.now-HEALTH.first_ts)/86400)):0;
  const la=ALERTS.length?`last alert ${ago(ALERTS[0].first_seen)}`:'no alerts yet — correct for a rare-event detector';
  $('#hdr').textContent=`${HEALTH.routes} routes · watching ${days}d · ${HEALTH.ready}/${HEALTH.routes} baselines ready · ${la}`;
  render();note();
}
load();
</script></body></html>
